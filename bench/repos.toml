# Benchmark repositories (osojicode/wiki specs/0005, Phase 0.1). Version 1.
#
# Selection, 2026-09-05: open-source, 100-2000 source files where possible,
# active docs, no prior osoji exposure except mcp-debugger (the PR #643 set,
# also the origin of most corpus cases; kept in dev and reported as
# contaminated). Docs-fix counts are non-merge commits in the last 24 months
# that touched only docs and removed or changed lines, "substantive" after
# dropping subjects that mention typos, spelling, links, formatting or
# licensing. Splits are by repository; changing them is a version bump.

version = 1
since = "24 months ago"

[[repo]]
name = "mcp-debugger"
url = "https://github.com/debugmcp/mcp-debugger.git"
language = "TypeScript"
split = "dev"
source_files = 782
docs_fix_commits = 15
notes = "PR #643 ground truth lives in runs/ (branch honesty-test-instruments); 105 of 151 corpus cases come from here"

